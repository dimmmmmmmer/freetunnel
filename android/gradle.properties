org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# Keep JVM tests for both debug and release, as before AGP 9.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Maven Central answers CI's shared runners 429 (Too Many Requests) at times.
# Gradle retries 429 and 5xx, by default 3 tries 1 s then 2 s apart, too short
# for its rate limit: 6 tries 3, 6, 12, 24 and 48 s apart ride out ~1.5 minutes.
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=3000
