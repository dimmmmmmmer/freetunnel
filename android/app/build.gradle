plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The app's version, X.Y.Z, set here and nowhere else. An official release is
// tagged android-X.Y.Z, and the tag must equal this, as the desktop's v-tags must
// equal project(VERSION). versionCode follows from it, X*10000 + Y*100 + Z, so it
// always grows with the version. The preview was 0.9.0, below the first official
// android-1.0.0. Preview and CI builds are not signed with the release key, so
// they are not offered updates: Android would refuse to install them anyway.
def appVersion = '1.0.0'
def appVersionCode = appVersion.tokenize('.').collect { it as int }.with { it[0] * 10000 + it[1] * 100 + it[2] }

dependencies {
    implementation files('libs/trusttunnel-client-android-1.1.7.aar')
    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'com.akuleshov7:ktoml-core:0.7.0'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    // The QR code a TV shows for Receive from phone (LinkReceiver). MIT, no
    // dependencies of its own, about 40 KB, where zxing's core is about 550 KB.
    implementation 'io.nayuki:qrcodegen:1.8.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation 'androidx.core:core-ktx:1.16.0'
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace 'org.freetunnel.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.freetunnel.android'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode appVersionCode
        versionName appVersion
        // One canonical public key shared with the desktop updater.
        def keyHeader = rootProject.file('../include/core/ReleaseSigning.h').text
        def keyMatch = keyHeader =~ /MCowBQYDK2VwAyEA[A-Za-z0-9+\/=]+/
        if (!keyMatch.find()) throw new GradleException('Missing release verification key')
        buildConfigField 'String', 'RELEASE_SIGNING_KEY', '\"' + keyMatch.group() + '\"'
        // The release certificate's SHA-256, which the app checks its own signer and
        // every downloaded update against. Read as check-android-signer.sh reads it,
        // trailing newlines dropped. Without the file the build is not official and
        // never offers updates; a malformed pin would ship a build that can never
        // update itself, so it fails the build.
        def pinFile = rootProject.file('release-certificate.sha256')
        def pin = pinFile.exists() ? pinFile.text.replaceAll(/\n+\z/, '') : ''
        if (pinFile.exists() && !(pin ==~ /[0-9a-f]{64}/)) {
            throw new GradleException('android/release-certificate.sha256 must be one line of 64 lowercase hex characters')
        }
        buildConfigField 'String', 'RELEASE_CERTIFICATE_SHA256', '\"' + pin + '\"'
    }
    buildFeatures { buildConfig true }
    // Release builds are unsigned. scripts/sign-android-release.sh signs them
    // with Build Tools alone, so Gradle and its plugins never see the keystore.
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
}

tasks.register('verifyPinnedRuntime') {
    def artifact = file('libs/trusttunnel-client-android-1.1.7.aar')
    inputs.file(artifact)
    doLast {
        if (!artifact.exists()) throw new GradleException('Run ../scripts/prepare-trusttunnel-android.sh first')
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
        if (digest != '5398df61f74610d1d63819059bb596560feb51882e9ca78609df32fc4c7840f7') {
            throw new GradleException('TrustTunnel AAR checksum mismatch')
        }
    }
}
tasks.named('preBuild') { dependsOn('verifyPinnedRuntime') }
