plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The app's version, X.Y.Z, set here and nowhere else. An official release is
// tagged android-X.Y.Z, and the tag must equal this, as the desktop's v-tags must
// equal project(VERSION). versionCode follows from it, X*10000 + Y*100 + Z, so it
// always grows with the version. The preview was 0.9.0, below the first official
// android-1.0.0. Preview and CI builds are not signed with the release key, so
// they are not offered updates: Android would refuse to install them anyway.
def appVersion = '1.0.0'
def appVersionCode = appVersion.tokenize('.').collect { it as int }.with { it[0] * 10000 + it[1] * 100 + it[2] }

// The TrustTunnel core the app is built on: one AAR, pinned by name here and by checksum in verifyPinnedRuntime. Its version
// is read from that name (BuildConfig.CORE_VERSION), for the footer of Settings: "TrustTunnel core 1.1.7", as the desktop's
// says which core it carries.
def coreAar = 'trusttunnel-client-android-1.1.7.aar'
def coreVersionMatch = coreAar =~ /^trusttunnel-client-android-(\d+(?:\.\d+)*)\.aar$/
if (!coreVersionMatch.matches()) throw new GradleException("The core AAR's name must be trusttunnel-client-android-<version>.aar, not ${coreAar}")
def coreVersion = coreVersionMatch.group(1)

dependencies {
    implementation files("libs/${coreAar}")
    implementation 'org.slf4j:slf4j-api:1.7.25'
    implementation 'com.github.tony19:logback-android:2.0.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'com.akuleshov7:ktoml-core:0.7.0'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.86'
    // The QR code a TV shows for Receive from phone (LinkReceiver). MIT, no
    // dependencies of its own, about 40 KB, where zxing's core is about 550 KB.
    implementation 'io.nayuki:qrcodegen:1.8.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    implementation 'androidx.core:core-ktx:1.16.0'
    testImplementation 'junit:junit:4.13.2'
    // The platform's org.json is a stub in unit tests (every call throws); SplitProfiles keeps its profiles as JSON.
    testImplementation 'org.json:json:20231013'
}

android {
    namespace 'org.freetunnel.android'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.freetunnel.android'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        versionCode appVersionCode
        versionName appVersion
        // One canonical public key shared with the desktop updater.
        def keyHeader = rootProject.file('../include/core/ReleaseSigning.h').text
        def keyMatch = keyHeader =~ /MCowBQYDK2VwAyEA[A-Za-z0-9+\/=]+/
        if (!keyMatch.find()) throw new GradleException('Missing release verification key')
        buildConfigField 'String', 'RELEASE_SIGNING_KEY', '\"' + keyMatch.group() + '\"'
        // The release certificate's SHA-256, which the app checks its own signer and
        // every downloaded update against. Read as check-android-signer.sh reads it,
        // trailing newlines dropped. Without the file the build is not official and
        // never offers updates; a malformed pin would ship a build that can never
        // update itself, so it fails the build.
        def pinFile = rootProject.file('release-certificate.sha256')
        def pin = pinFile.exists() ? pinFile.text.replaceAll(/\n+\z/, '') : ''
        if (pinFile.exists() && !(pin ==~ /[0-9a-f]{64}/)) {
            throw new GradleException('android/release-certificate.sha256 must be one line of 64 lowercase hex characters')
        }
        buildConfigField 'String', 'RELEASE_CERTIFICATE_SHA256', '\"' + pin + '\"'
        buildConfigField 'String', 'CORE_VERSION', '\"' + coreVersion + '\"'
    }
    buildFeatures { buildConfig true }
    // Release builds are unsigned. scripts/sign-android-release.sh signs them
    // with Build Tools alone, so Gradle and its plugins never see the keystore.
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = '11' }
}

// The third-party notices, from the repository, into the APK's assets:
// THIRD_PARTY_NOTICES.md, LICENSE (the Apache License 2.0 that most of the
// libraries use) and the license texts under licenses/common and
// licenses/android. The app shows them nowhere (the desktop has no screen for
// its notices either; they are files next to the program, as these are in the
// APK), and scripts/check-apk-notices.sh checks a built APK for them. Copied at
// build time rather than kept here as a second copy that could fall behind.
abstract class CopyThirdPartyNotices extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract RegularFileProperty getNotices()
    @InputFile @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract RegularFileProperty getLicense()
    @InputDirectory @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getLicenseTexts()
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        def out = outputDir.get().asFile
        out.deleteDir()
        out.mkdirs()
        java.nio.file.Files.copy(notices.get().asFile.toPath(), new File(out, 'THIRD_PARTY_NOTICES.md').toPath())
        java.nio.file.Files.copy(license.get().asFile.toPath(), new File(out, 'LICENSE').toPath())
        ['common', 'android'].each { group ->
            def from = new File(licenseTexts.get().asFile, group)
            if (!from.isDirectory()) throw new GradleException("Missing ${from}")
            def to = new File(out, "licenses/${group}")
            to.mkdirs()
            from.eachFile(groovy.io.FileType.FILES) { text ->
                java.nio.file.Files.copy(text.toPath(), new File(to, text.name).toPath())
            }
        }
    }
}
def copyThirdPartyNotices = tasks.register('copyThirdPartyNotices', CopyThirdPartyNotices) {
    notices.set(rootProject.file('../THIRD_PARTY_NOTICES.md'))
    license.set(rootProject.file('../LICENSE'))
    licenseTexts.set(rootProject.file('../licenses'))
    outputDir.set(layout.buildDirectory.dir('generated/thirdPartyNotices'))
}

// What the desktop app has compiled in and this one reads: the lists under data/split, into the APK's assets, so that
// each is one file for both apps. recommended-russia.txt is "Recommended for Russia" (split/recommended-russia.txt);
// default-excluded-routes.txt is the excluded routes a new installation starts with and that Settings' "Restore
// defaults" puts back (split/default-excluded-routes.txt). The desktop's cmake/SharedData.cmake reads the same files;
// RussiaListTest and ExcludedRoutesTest check that every line of them is one this app takes.
abstract class CopySharedData extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract RegularFileProperty getRecommendedRussia()
    @InputFile @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract RegularFileProperty getDefaultExcludedRoutes()
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        def out = outputDir.get().asFile
        out.deleteDir()
        def split = new File(out, 'split')
        split.mkdirs()
        java.nio.file.Files.copy(recommendedRussia.get().asFile.toPath(), new File(split, 'recommended-russia.txt').toPath())
        java.nio.file.Files.copy(defaultExcludedRoutes.get().asFile.toPath(), new File(split, 'default-excluded-routes.txt').toPath())
    }
}
def copySharedData = tasks.register('copySharedData', CopySharedData) {
    recommendedRussia.set(rootProject.file('../data/split/recommended-russia.txt'))
    defaultExcludedRoutes.set(rootProject.file('../data/split/default-excluded-routes.txt'))
    outputDir.set(layout.buildDirectory.dir('generated/sharedData'))
}
// Inter, the typeface of both apps (SIL OFL 1.1), from assets/fonts/inter into the APK's font resources: res/font/inter_regular.ttf and
// inter_medium.ttf (a resource's name is lowercase), which Fonts reads and the theme names as android:fontFamily. The desktop compiles the
// same two files in (assets/fonts/fonts.qrc), so there is one copy of each in the repository. Fonts are binaries nobody reads in review: the
// build checks each against SHA256SUMS before it copies it, as verifyPinnedRuntime does the AAR, and scripts/check-apk-data.sh checks the
// APK for the same bytes. Regular (400) is for all text and Medium (500) for what the desktop sets in Font.Medium; no other weight.
abstract class CopyInterFonts extends DefaultTask {
    @InputFile @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract RegularFileProperty getChecksums()
    @InputFile @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract RegularFileProperty getRegular()
    @InputFile @PathSensitive(PathSensitivity.NAME_ONLY)
    abstract RegularFileProperty getMedium()
    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void copy() {
        def sums = [:]
        checksums.get().asFile.eachLine { line ->
            def entry = line =~ /^([0-9a-f]{64})  (\S+)$/
            if (entry.matches()) sums[entry.group(2)] = entry.group(1)
        }
        def out = outputDir.get().asFile
        out.deleteDir()
        def fonts = new File(out, 'font')
        fonts.mkdirs()
        install(regular.get().asFile, 'inter_regular.ttf', sums, fonts)
        install(medium.get().asFile, 'inter_medium.ttf', sums, fonts)
    }

    static void install(File source, String name, Map sums, File to) {
        def want = sums[source.name]
        if (want == null) throw new GradleException("${source.name} is not in assets/fonts/inter/SHA256SUMS")
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
        if (digest != want) throw new GradleException("${source.name} does not match its SHA-256 in assets/fonts/inter/SHA256SUMS")
        java.nio.file.Files.copy(source.toPath(), new File(to, name).toPath())
    }
}
def copyInterFonts = tasks.register('copyInterFonts', CopyInterFonts) {
    checksums.set(rootProject.file('../assets/fonts/inter/SHA256SUMS'))
    regular.set(rootProject.file('../assets/fonts/inter/Inter-Regular.ttf'))
    medium.set(rootProject.file('../assets/fonts/inter/Inter-Medium.ttf'))
    outputDir.set(layout.buildDirectory.dir('generated/interFonts'))
}
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(copyThirdPartyNotices) { it.outputDir }
        variant.sources.assets?.addGeneratedSourceDirectory(copySharedData) { it.outputDir }
        variant.sources.res?.addGeneratedSourceDirectory(copyInterFonts) { it.outputDir }
    }
}

tasks.register('verifyPinnedRuntime') {
    def artifact = file("libs/${coreAar}")
    inputs.file(artifact)
    doLast {
        if (!artifact.exists()) throw new GradleException('Run ../scripts/prepare-trusttunnel-android.sh first')
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
        if (digest != '5398df61f74610d1d63819059bb596560feb51882e9ca78609df32fc4c7840f7') {
            throw new GradleException('TrustTunnel AAR checksum mismatch')
        }
    }
}
tasks.named('preBuild') { dependsOn('verifyPinnedRuntime') }
