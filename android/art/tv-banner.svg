<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Android TV launcher banner, rendered into res/drawable-xhdpi/banner.png by
       scripts/render-android-tv-banner.sh. Opaque, on the app's dark background,
       and with square corners: launchers round them themselves. Only the mark
       from assets/logo.svg is shown, centred by its visible bounds. The launcher
       displays the app name below the tile. -->
  <rect width="320" height="180" fill="#181818"/>
  <g transform="translate(90 24.2) scale(1.4)">
    <path d="M12 86 L12 46 A38 38 0 0 1 88 46 L88 86 Z" fill="#d0d0d0"/>
    <path d="M24 86 L24 50 A26 26 0 0 1 76 50 L76 86 Z" fill="#a3a3a3"/>
    <path d="M36 86 L36 55 A14 14 0 0 1 64 55 L64 86 Z" fill="#757575"/>
    <path d="M46 86 L46 60 A4 4 0 0 1 54 60 L54 86 Z" fill="#454545"/>
  </g>
</svg>
