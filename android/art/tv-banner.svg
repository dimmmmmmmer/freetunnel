<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Android TV launcher banner, rendered into res/drawable-xhdpi/banner.png by
       scripts/render-android-tv-banner.sh. Opaque, on the app's dark background,
       and with square corners: launchers round them themselves. The mark is
       assets/logo.svg's, 104 px square, and the name is the same in every
       language, so one banner does. -->
