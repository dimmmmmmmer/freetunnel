name: Security

# Static analysis and dependency hygiene. Keeps feedback fast — no VPN core build.

on:
  push:
    branches: [main]
    # Run on the tag as well: a release waits for this workflow to pass on the
    # tagged commit (see the same trigger in tests.yml).
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # This repository goes quiet for weeks at a time. Without a scheduled run the
  # first CI after a gap mixes two different things: what the new commit broke,
  # and what drifted underneath it while nothing was pushed — a newer cppcheck
  # or clang-tidy in the runner image, or the pinned upstream ref going away.
  # A weekly run on main separates them, so a red build after a quiet spell is
  # about the commit and nothing else.
  schedule:
    - cron: '23 5 * * 1' # Mondays, 05:23 UTC

concurrency:
  # The event is part of the group so a push cannot cancel the scheduled run
  # that exists precisely to sample a quiet main.
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Kept identical across workflows; scripts/check-pinned-deps.sh enforces that.
  QT_VER: '6.8.3'

# Least privilege by default: no job needs to write to the repo except the
# release job, which asks for contents: write explicitly. Without this the
# repo/org default applies, handing a write-capable token to every job —
# including the ones that execute third-party tooling.
permissions:
  contents: read

jobs:
  # Whether this run needs the desktop checks: false only for a pull request
  # that changes nothing but Android's files. The same job as in tests.yml,
  # where the comment says why the checks are skipped from inside and never by
  # on.paths; scripts/check-desktop-changes.sh has the rules. "pinned dependency
  # refs" and "dependency review" do not ask it and run on every pull request,
  # Android's included: android.yml pins its actions as well.
  changes:
    name: desktop changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To list the pull request's files.
      pull-requests: read
    outputs:
      # Empty off pull requests, where the steps do not run. Every desktop job
      # treats anything but false as true.
      desktop: ${{ steps.decide.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: /scripts/check-desktop-changes.sh
          sparse-checkout-cone-mode: false

      - name: Only Android's files?
        id: decide
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-desktop-changes.sh

  cppcheck:
    name: cppcheck
    needs: changes
    # Skipped on an Android-only change, which reports it as a success. Not
    # when changes failed: a failed need skips a job whose `if` has no status
    # function, and the check would then pass with nothing run.
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    # Named, not ubuntu-latest. That label becomes Ubuntu 26.04 from 2026-10-19,
    # and apt's cppcheck with it: a newer analyser finds new things, and main
    # would turn red with no commit to blame. Moving to a newer one is a change
    # of its own, made on purpose, with its findings in the same PR.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cppcheck
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y cppcheck
          # 24.04 ships 2.13. Say so if the image ever hands us another.
          v="$(cppcheck --version)"
          echo "$v"
          case "$v" in
            'Cppcheck 2.13'*) ;;
            *) echo "::error::expected cppcheck 2.13 (Ubuntu 24.04), got '$v'"; exit 1 ;;
          esac

      - name: Run cppcheck
        run: |
          set -eux
          # Suppressions come from the file, not from this list: they are also
          # needed by Codacy (which cannot read the file) and by anyone running
          # cppcheck locally. One copy here is one copy that can go stale.
          cppcheck --error-exitcode=1 \
            --enable=warning,performance,portability \
            --suppressions-list=cppcheck-suppressions.txt \
            --inline-suppr \
            --library=qt \
            -I include -I include/app -I include/core -I include/vpn \
            include src

      - name: Codacy suppressions match the list
        run: |
          set -eu
          # Codacy takes cppcheck flags only from .codacy.yml (engines.cppcheck.
          # extra_lines), so that copy is unavoidable. What is avoidable is the
          # two drifting apart and analysis disagreeing with CI for months.
          missing=0
          while read -r id; do
            case "$id" in ''|\#*) continue ;; esac
            grep -q -- "--suppress=$id\"" .codacy.yml || { echo "::error::$id is suppressed for CI but not in .codacy.yml"; missing=1; }
          done < cppcheck-suppressions.txt
          [ "$missing" -eq 0 ]

  pinned-deps:
    name: pinned dependency refs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify pinned upstream and FetchContent tags
        run: bash scripts/check-pinned-deps.sh

      # A dependency bump that leaves THIRD_PARTY_NOTICES.md behind fails here.
      - name: The third-party notices name the pinned versions
        run: bash scripts/check-third-party-notices.sh

  dependency-review:
    permissions:
      contents: read
      pull-requests: read
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  clang-tidy:
    name: clang-tidy
    needs: changes
    # As at cppcheck.
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    # Named, and clang-tidy by its major, for the reason given at cppcheck: on
    # 26.04 the unversioned package is a newer clang-tidy with checks of its own.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy-18 libssl-dev libsecret-1-dev pkg-config \
            libxcb1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VER }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Run clang-tidy
        env:
          CLANG_TIDY: clang-tidy-18
        run: bash scripts/run-clang-tidy.sh build-tidy

  upstream-patch:
    name: upstream patch verify
    needs: changes
    # As at cppcheck.
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify the vendored patches apply to pinned upstream
        run: bash scripts/verify_upstream_patch.sh

  i18n:
    name: i18n catalog freshness
    needs: changes
    # As at cppcheck.
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    # Named, as at cppcheck, so that a new image is a change made on purpose.
    # The linguist tools themselves come from QT_VER's Qt (below), not from apt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The linguist tools of the Qt the release is built with, not the runner
      # distro's qt6-l10n-tools, whose Qt is whatever that Ubuntu release carries:
      # the check regenerates the catalogue and compares bytes, so another lupdate
      # or lrelease can ask for different ones than those the developer's Qt wrote
      # and the app ships. QT_VER is an exact version for that reason, the one
      # CONTRIBUTING tells developers to use. i18n-update.sh takes the tools from
      # $QT_ROOT_DIR, set here.
      - name: Install Qt
        uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4
        with:
          version: ${{ env.QT_VER }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Verify translation catalog is up to date
        run: bash scripts/i18n-verify.sh
