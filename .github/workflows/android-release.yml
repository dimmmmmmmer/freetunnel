name: Android release

# Publishes FreeTunnel for Android when an android-X.Y.Z tag is pushed: a
# release with the signed APK, SHA256SUMS-android.txt and its Ed25519
# signature, which is what the in-app updater looks for (UpdatePolicy.kt in
# android/app/src/main/java/org/freetunnel/android). The desktop's v* tags are
# released by build.yml, and no other workflow runs on an android-* tag.
#
# Everything that can be checked in seconds is checked first: the tag, that
# its commit is on main and its version not yet published, the pin, the notes,
# and that the secrets are set. Then the whole Android CI runs on the tagged
# commit, and only after that does any job see a signing key.
#
# Each job holds as little as it can:
# - build runs Gradle, and with it the plugins and dependencies Gradle loads,
#   with no secrets at all, and makes the APK unsigned. No job here restores a
#   Gradle cache, so nothing an earlier run left behind goes into a release.
# - sign holds the keystore and its passwords and runs no Gradle and none of
#   the project's build code: only Build Tools' zipalign, apksigner and aapt2,
#   through scripts/sign-android-release.sh. Android CI runs that script on
#   every Android pull request with a throwaway keystore.
# - publish holds the Ed25519 key and the only token that can write.
#
# The keystore secrets are in the android-release environment, which only
# android-* tags may deploy to, so a workflow run from a branch cannot read
# them. A run from such a tag can, and it runs the workflows of the commit
# the tag names, so pushing an android-* tag is a release decision. Only the
# release-secrets and sign jobs use the environment. android.yml, called below,
# never sees them: a called workflow gets only the secrets passed to it, and
# none are. GitHub creates an environment that a workflow names and that does
# not exist yet, with no protection and no secrets, so it has to be set up
# before the first tag; see Releasing in android/README.md.
#
# Tests and Security are not waited for, unlike for a desktop release. Neither
# builds or analyses the Android app (the suites of this workflow's scripts
# run in Android CI, and in Tests too when a pull request is not Android-only),
# and neither runs on this tag. A run of theirs on the commit would have to
# come from a push to main, where merging two pull requests in a row cancels
# the first one's runs, and that would stop a valid release. The part of
# Security that is about this workflow, every action pinned to a commit, runs
# in the first job instead.
on:
  push:
    tags: ['android-*']

# Least privilege by default: only the publish job asks for contents: write.
permissions:
  contents: read

concurrency:
  # One run per tag, never cancelled halfway; a second push of the same tag
  # waits for the first run to finish. Not android.yml's group: called from
  # here, its github.workflow is this workflow's name, and two equal groups
  # would deadlock.
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The release key's alias in the keystore. Not a secret: GitHub masks a
  # secret's value wherever it appears in the log, and as one, every
  # 'freetunnel' in a path, a file name or org.freetunnel.android would read
  # '***'.
  ANDROID_KEY_ALIAS: freetunnel

jobs:
  release-secrets:
    name: Check the release secrets are set
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: android-release
    steps:
      # Only 'true' or 'false' reaches the runner, never a value. sign and
      # publish check again, and theirs are the checks that count.
      - name: The release secrets are set
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAVE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAVE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAVE_ED25519_KEY: ${{ secrets.ED25519_SIGNING_KEY != '' }}
        run: |
          set -eu
          missing=""
          [ "$HAVE_KEYSTORE" = true ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ "$HAVE_KEYSTORE_PASSWORD" = true ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ "$HAVE_KEY_PASSWORD" = true ] || missing="$missing ANDROID_KEY_PASSWORD"
          [ "$HAVE_ED25519_KEY" = true ] || missing="$missing ED25519_SIGNING_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Release secrets missing::Not set:$missing. The first three belong in the android-release environment, ED25519_SIGNING_KEY in the repository; see Releasing in android/README.md."
            exit 1
          fi
          echo "The keystore, both passwords and the Ed25519 key are set."

  check:
    name: Check the tag, the commit, the pin and the notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # All of main's history, to tell whether the tagged commit is on it.
          fetch-depth: 0
          persist-credentials: false

      # The tag comes in through env, never spliced into the script.
      - name: The tag is android-X.Y.Z and equals appVersion
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/check-android-release-tag.sh "$TAG"

      # Pull requests are squash-merged, so a commit of the pull request's own
      # branch is never on main, and tagging that branch by mistake would
      # release a tree that is not main's.
      - name: The tagged commit is on main
        run: |
          set -u
          rc=0
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || rc=$?
          if [ "$rc" -eq 1 ]; then
            echo "::error title=Tag not on main::$GITHUB_SHA is not on main. Merge the release pull request, then tag main: git switch main && git pull --ff-only, as in Releasing in android/README.md."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error title=Cannot compare with main::git merge-base could not tell whether $GITHUB_SHA is on origin/main (exit $rc)."
            exit 1
          fi
          echo "$GITHUB_SHA is on main."

      # A published version's files never change. Checked here to fail fast,
      # and again right before publishing (see the publish job).
      - name: The version is not published yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/check-android-release-unpublished.sh "$TAG"

      - name: The release certificate is pinned
        run: bash scripts/check-android-signer.sh android/release-certificate.sha256

      # The jobs below run third-party actions next to the signing secrets.
      - name: Every action is pinned to a commit
        run: bash scripts/check-pinned-deps.sh

      # What changed comes from android/CHANGELOG.md, so every release says
      # something about itself. Its sections are '## <version>' under one
      # '# ' title, as in the desktop's CHANGELOG.md. The install notes are the
      # part that is the same every time, appended after the real notes and
      # never instead of them. Written here, not at the end, so that a missing
      # section stops the release before the CI and the build, not after.
      - name: Assemble release notes
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          awk -v want="## $VERSION" '
            { line = $0; sub(/[ \t\r]+$/, "", line) }
            found && (line ~ /^## / || line ~ /^# /) { exit }
            line == want { found = 1; next }
            found { print }
          ' android/CHANGELOG.md > notes.md
          # Trim leading blank lines.
          sed -i -e '/./,$!d' notes.md
          if [ ! -s notes.md ]; then
            echo "::error title=No release notes::android/CHANGELOG.md has no '## $VERSION' section. Write what changed for users before tagging."
            exit 1
          fi
          pin="$(cat android/release-certificate.sha256)"
          {
            echo
            echo "### Installing"
            echo
            echo "- Download \`freetunnel-android-$VERSION.apk\` on your phone and open it. The first"
            echo "  time, Android asks you to let your browser or file manager install apps"
            echo "  (**Install unknown apps**): allow it for that app."
            echo "- Later releases install over this one and keep your profiles. Settings →"
            echo "  **Check for updates** offers them and verifies them before installing."
            echo "- A build signed with another key (a fork's release, the 0.x preview, a debug"
            echo "  build) cannot be updated in place: Android refuses it. Uninstall it first."
            echo "  That deletes its saved profiles, so keep your configs or links at hand to"
            echo "  import them again."
            echo
            echo "Verify your download against \`SHA256SUMS-android.txt\` (signed as"
            echo "\`SHA256SUMS-android.txt.sig\`): \`sha256sum -c SHA256SUMS-android.txt\`. The APK is"
            echo "signed with the certificate whose SHA-256 is \`$pin\`"
            echo "(\`apksigner verify --print-certs\`)."
          } >> notes.md
          echo "--- release body ---"
          cat notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-notes
          path: notes.md
          if-no-files-found: error

  ci:
    name: Android CI
    needs: [check, release-secrets]
    uses: ./.github/workflows/android.yml
    with:
      gradle-cache-disabled: true

  build:
    name: Build the unsigned APK
    needs: [check, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android SDK 35 packages
        # As in android.yml: the runner image's command-line tools.
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # No cache at all in a release build, and never the proprietary one
          # (see android.yml).
          cache-provider: basic
          cache-disabled: true
      - run: scripts/prepare-trusttunnel-android.sh
      # Unsigned: build.gradle has no signing config, and this job no secret.
      # The ci job has run the tests and lint on this commit already.
      - name: Build the release APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: The APK carries the third-party notices
        run: bash scripts/check-apk-notices.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-unsigned
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  sign:
    name: Sign the APK
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-release
    steps:
      - name: Check out the signing scripts and the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/sign-android-release.sh
            /scripts/check-android-signer.sh
            /android/release-certificate.sha256
          sparse-checkout-cone-mode: false
      # apksigner is a Java program.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android Build Tools 35.0.0
        # The runner image's command-line tools, as in android.yml. zipalign,
        # apksigner and aapt2 are all this job needs from the SDK.
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release-unsigned
          path: unsigned

      - name: Sign and check the release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # NOTE: no -x here. Tracing would print the keystore and its passwords
          # into the job log, where only GitHub's best-effort masking stands
          # between them and anyone who can read the run.
          set -euo pipefail
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            # An APK signed with any other key could never update an installed
            # official one, so nothing is signed without the release keystore.
            echo "::error title=Android signing secrets missing::Not set:$missing. Add them to the android-release environment as described under Releasing in android/README.md, then re-run this job."
            exit 1
          fi
          # umask before the redirect, not chmod after: the file is created with
          # the ambient mode first, and the keystore would be readable by
          # anything else on the runner until the chmod.
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release-keystore"
          if ! (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"); then
            echo "::error title=Bad keystore secret::ANDROID_KEYSTORE_BASE64 is not base64. Set it from the keystore file as described under Releasing in android/README.md."
            exit 1
          fi
          unset ANDROID_KEYSTORE_BASE64
          bash scripts/sign-android-release.sh unsigned/app-release-unsigned.apk \
            "dist/freetunnel-android-$VERSION.apk" android/release-certificate.sha256 "$VERSION"
          ls -la dist

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore"

      # The APK only. It is what people install and what the app updates itself
      # from. An AAB is for app stores, and this project publishes to none.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-apk
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [check, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the signature check and the published check
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/verify-release-signature.sh
            /scripts/check-android-release-unpublished.sh
            /include/core/ReleaseSigning.h
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release-apk
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-release-notes
          path: notes

      # Exactly what UpdatePolicy.verifyManifest accepts: the first line is
      # #version=X.Y.Z, which binds the signed bytes to this release so that an
      # older manifest and signature cannot be replayed, and then one entry for
      # the APK, "<sha-256>  <name>", as sha256sum writes it. The '#' line is a
      # comment to sha256sum -c, so people can check the file by hand too.
      - name: Write SHA256SUMS-android.txt
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          apk="freetunnel-android-${VERSION:?}.apk"
          shopt -s nullglob dotglob
          got=(*)
          if [ "${#got[@]}" -ne 1 ] || [ "${got[0]}" != "$apk" ]; then
            echo "::error title=Unexpected build output::expected only $apk from the sign job, got: ${got[*]}"
            exit 1
          fi
          hash="$(sha256sum "$apk" | cut -d' ' -f1)"
          printf '#version=%s\n%s  %s\n' "$VERSION" "$hash" "$apk" > SHA256SUMS-android.txt
          sha256sum --strict -c SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt

      # The same Ed25519 key as the desktop's SHA256SUMS.txt, signed the same
      # way as in build.yml: the app verifies it against the public key it is
      # built with, from include/core/ReleaseSigning.h.
      - name: Sign SHA256SUMS-android.txt
        env:
          ED25519_SIGNING_KEY: ${{ secrets.ED25519_SIGNING_KEY }}
        run: |
          # NOTE: no -x here. Tracing this step would echo the raw private key
          # into the job log.
          set -eu
          if [ -z "${ED25519_SIGNING_KEY:-}" ]; then
            # The app refuses an unsigned release, so publishing one would leave
            # every installed copy without the update.
            echo "::error title=ED25519_SIGNING_KEY missing::refusing to publish an unsigned release: installed apps would reject it as an update."
            exit 1
          fi
          # In the runner's temp directory, not next to the assets, and removed
          # however this step ends. umask before the redirect, as above.
          key="$RUNNER_TEMP/ed25519.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s' "$ED25519_SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin \
            -in dist/SHA256SUMS-android.txt -out dist/SHA256SUMS-android.txt.sig
          ls -la dist/SHA256SUMS-android.txt.sig

      # A secret that stopped matching include/core/ReleaseSigning.h would sign
      # without complaint and publish a release every installed app refuses.
      # So check the signature the way the app will, before publishing.
      - name: Check the signature against the app's public key
        run: |
          bash scripts/verify-release-signature.sh include/core/ReleaseSigning.h \
            dist/SHA256SUMS-android.txt dist/SHA256SUMS-android.txt.sig

      # Again, right before publishing. "Re-run job" on build, sign or this job
      # runs it and what follows it, never the check job, and the action below
      # replaces the files of a release that is already published.
      - name: The version is still not published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/check-android-release-unpublished.sh "$TAG"

      # Never GitHub's "latest": the desktop updater asks /releases/latest
      # first, and that must stay a desktop release. The value must be the
      # string 'false': anything the action does not know falls back to the
      # API's default, which marks the release latest. Not a prerelease either,
      # because the app ignores those.
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: FreeTunnel for Android ${{ needs.check.outputs.version }}
          body_path: notes/notes.md
          prerelease: false
          make_latest: 'false'
          fail_on_unmatched_files: true
          files: |
            dist/freetunnel-android-${{ needs.check.outputs.version }}.apk
            dist/SHA256SUMS-android.txt
            dist/SHA256SUMS-android.txt.sig
