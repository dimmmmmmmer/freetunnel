name: Tests

# Fast, core-independent unit tests (Qt only — no conan/VPN core), so they give
# quick feedback on every push/PR without the heavy native build.

on:
  push:
    branches: [main]
    # A release is published only once this workflow has passed on the tagged
    # commit (scripts/check-release-ci.sh, in the release job). A run on main
    # usually covers it, but not when a later push cancelled that run or the tag
    # is not on main, so the tag runs it too.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Weekly run on a quiet main, for two reasons. The same runner-image drift the
  # Security workflow watches for, and the Windows unit-test intermittency that
  # has never been reproduced on demand: a scheduled run samples it on a cadence,
  # so the next time it shows up there is a history to compare against instead of
  # one mystery failure with nothing around it.
  schedule:
    - cron: '41 5 * * 1' # Mondays, 05:41 UTC

concurrency:
  # The event is part of the group so a push cannot cancel the scheduled run
  # that exists precisely to sample a quiet main.
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Kept identical across workflows; scripts/check-pinned-deps.sh enforces that.
  QT_VER: '6.12.0'
  # Upstream fix for Qt 6.11's split Windows SDK repositories (not in aqt 3.3.0).
  AQT_SOURCE: 'git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4'
  # Exact pin, same as build.yml: conan drives every native dependency fetch.
  CONAN_VER: '2.31.1'

# Least privilege by default: no job needs to write to the repo except the
# release job, which asks for contents: write explicitly. Without this the
# repo/org default applies, handing a write-capable token to every job —
# including the ones that execute third-party tooling.
permissions:
  contents: read

jobs:
  # Whether this run needs the desktop jobs, which here is all of them. The
  # answer is false only for a pull request that changes nothing but Android's
  # files, which android.yml builds and tests and nothing here does. A push, a
  # tag, a dispatch or the weekly run is true without asking anything, and so
  # is any doubt; scripts/check-desktop-changes.sh has the rules. Build and
  # Security have the same job.
  #
  # A false skips the work, never the checks. main's branch protection requires
  # them by name, and a workflow that on.paths keeps from starting reports
  # nothing, so the pull request would wait for it for ever. A job skipped by
  # its `if` reports success under its own name, and that is how Coverage and
  # ASan+UBSan skip. The unit tests cannot: a job's `if` is evaluated before its
  # matrix is applied, so a matrix job skipped whole reports under no leg's name
  # and "Unit tests (windows-latest)" would never come. Its legs start and skip
  # their steps instead.
  changes:
    name: desktop changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To list the pull request's files.
      pull-requests: read
    outputs:
      # Empty off pull requests, where the steps do not run. Every desktop job
      # treats anything but false as true.
      desktop: ${{ steps.decide.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          sparse-checkout: /scripts/check-desktop-changes.sh
          sparse-checkout-cone-mode: false

      - name: Only Android's files?
        id: decide
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-desktop-changes.sh

  unit:
    name: Unit tests (${{ matrix.os }})
    needs: changes
    # Never skipped whole, for the matrix's sake (see changes): every leg starts.
    # The `if` is for a changes job that failed. The default, success(), would
    # then skip this job; !cancelled() runs it, and its steps too, as for any
    # doubt.
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Every step after this one runs unless changes answered false.
      - name: Android's files only, nothing to test
        if: needs.changes.outputs.desktop == 'false'
        run: echo "Only Android files changed (see the desktop changes job), so the steps below are skipped."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.changes.outputs.desktop != 'false'

      - name: Install build deps (Linux)
        if: needs.changes.outputs.desktop != 'false' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libsecret-1-dev pkg-config \
            dbus-x11 gnome-keyring libxcb1-dev

      - name: Install Qt (Linux)
        if: needs.changes.outputs.desktop != 'false' && runner.os == 'Linux'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VER }}
          aqtsource: ${{ env.AQT_SOURCE }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Install build deps (macOS)
        if: needs.changes.outputs.desktop != 'false' && runner.os == 'macOS'
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          # Homebrew's OpenSSL is keg-only, so CMake does not find it unaided, and
          # without it the update-signature tests skip their accept path. The
          # tests' configure now requires it on macOS; this is where it is.
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      # The Qt the macOS release is built with, not Homebrew's. `brew install qt`
      # gave whatever Homebrew had that week (6.11 by September 2026), so the
      # macOS tests ran on a Qt no release was ever built with, and a QT_VER bump
      # could not reach them.
      - name: Install Qt (macOS)
        if: needs.changes.outputs.desktop != 'false' && runner.os == 'macOS'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VER }}
          aqtsource: ${{ env.AQT_SOURCE }}
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: Set up MSVC (Windows)
        if: needs.changes.outputs.desktop != 'false' && runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install Qt (Windows)
        if: needs.changes.outputs.desktop != 'false' && runner.os == 'Windows'
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VER }}
          aqtsource: ${{ env.AQT_SOURCE }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        if: needs.changes.outputs.desktop != 'false'
        run: cmake -S tests -B build-tests -G Ninja

      - name: Build
        if: needs.changes.outputs.desktop != 'false'
        run: cmake --build build-tests -j

      # The process-lookup tests put another program on 127.0.0.2 beside a socket
      # of their own on 127.0.0.1. Linux and Windows answer the whole of 127/8 out
      # of the box; macOS configures only 127.0.0.1 on lo0, and without this those
      # tests would skip there, leaving macOS's reading of IPv4 addresses untested.
      - name: A second loopback address (macOS)
        if: needs.changes.outputs.desktop != 'false' && runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up

      - name: Test
        if: needs.changes.outputs.desktop != 'false'
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/run-ctest.sh build-tests

  coverage:
    name: Coverage (Linux)
    needs: changes
    # Skipped on an Android-only change, which reports it as a success. Not
    # when changes failed: a failed need skips a job whose `if` has no status
    # function, and the check would then pass with nothing run.
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    # Named, not ubuntu-latest: that label moves to 26.04 from 2026-10-19, and the
    # apt packages below would move with it (lcov, cmake). The unit-test leg above
    # stays on ubuntu-latest, the required check's name: it only has to build and
    # pass, so it is where a newer image should show up first, as a red test leg
    # rather than as an analyser's new opinions.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libsecret-1-dev pkg-config lcov \
            libfuse2 libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 git python3-pip \
            dbus-x11 gnome-keyring libxcb1-dev
          # Vendored, not fetched: this runs as root. See scripts/llvm.sh.
          sudo bash scripts/llvm.sh 18
          sudo apt-get install -y g++-13
          pip install "conan==${CONAN_VER}"

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VER }}
          aqtsource: ${{ env.AQT_SOURCE }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Build, test, and report coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: bash scripts/coverage-upstream-report.sh build-coverage coverage-out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage-out/
          if-no-files-found: error

      - name: Upload coverage to Codacy
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -z "${CODACY_PROJECT_TOKEN:-}" ]; then
            echo "::notice title=Codacy coverage::CODACY_PROJECT_TOKEN is not set — coverage stays at 0% on Codacy."
            exit 0
          fi
          # Must be the *Coverage* project token (Settings → Coverage), not Account → API tokens.
          #
          # The reporter is pinned and verified rather than piped from
          # coverage.codacy.com: that script runs with the project token in the
          # environment, so a compromise of that host would both exfiltrate the
          # token and execute arbitrary code in a runner that has the repo
          # checked out. Bump by changing the version and the digest together.
          reporter_version=14.1.3
          curl -fsSL -o codacy-reporter \
            "https://github.com/codacy/codacy-coverage-reporter/releases/download/${reporter_version}/codacy-coverage-reporter-linux"
          echo "15c5f052207d27b8501ab5d5910c68c206ea70b0157ee1725132780530580875  codacy-reporter" \
            | sha256sum -c -
          chmod +x codacy-reporter
          ./codacy-reporter report \
            --project-token "${CODACY_PROJECT_TOKEN}" \
            -r coverage-out/coverage.filtered.info \
            -l Cpp \
            --commit-uuid "${GITHUB_SHA}" \
            || {
              echo "::warning title=Codacy coverage upload failed::Use the Project API token from Codacy → freetunnel → Settings → Coverage (not Account → API tokens). See CONTRIBUTING.md."
              exit 1
            }

  sanitizers:
    name: ASan+UBSan (Linux)
    needs: changes
    # As at Coverage.
    if: ${{ !cancelled() && needs.changes.outputs.desktop != 'false' }}
    # Named for the same reason as Coverage: the compiler is the image's g++, and
    # a new major under the same label can bring findings no commit caused.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libsecret-1-dev pkg-config \
            dbus-x11 gnome-keyring libxcb1-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VER }}
          aqtsource: ${{ env.AQT_SOURCE }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Configure
        run: cmake -S tests -B build-asan -G Ninja -DFT_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build-asan -j

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0:allocator_may_return_null=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: bash scripts/run-ctest.sh build-asan
