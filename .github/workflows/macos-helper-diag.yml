# TEMPORARY: diagnostics for the real helper's tests on macOS. Removed once they pass.
name: macOS helper diagnostics

on:
  push:
    branches: [claude/trusting-lamport-vf2fid]
    paths: ['.github/workflows/macos-helper-diag.yml', 'scripts/macos-helper-diag.sh', 'tests/real_helper.h', 'tests/test_helper_server*.cpp']

permissions:
  contents: read

jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install build deps
        run: |
          brew list ninja >/dev/null 2>&1 || brew install ninja
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
      - uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: '6.8.3'
          host: mac
          target: desktop
          arch: clang_64
          cache: true
      - run: cmake -S tests -B build-diag -G Ninja
      - run: cmake --build build-diag --target freetunnel_test_helper test_helper_server test_helper_server_fuzz test_helper_server_lifecycle test_helper_server_settings -j
      - run: bash scripts/macos-helper-diag.sh build-diag
