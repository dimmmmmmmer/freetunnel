name: iOS
on:
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml', 'vendor/trusttunnel/**', 'data/**', 'android/core-source.json', 'scripts/export-patched-boringssl.sh']
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml', 'vendor/trusttunnel/**', 'data/**', 'android/core-source.json', 'scripts/export-patched-boringssl.sh']
  workflow_dispatch:
env:
  CONAN_VER: '2.31.1'
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-tests:
    name: iOS configuration and routing tests
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: swift test --package-path ios/FreeTunnelCore
  build:
    name: iOS unsigned device and simulator builds
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install build tools
        run: |
          brew install xcodegen ninja
          python3 -m venv .ios-tools
          .ios-tools/bin/pip install "conan==${CONAN_VER}" pyyaml==6.0.3
          echo "$PWD/.ios-tools/bin" >> "$GITHUB_PATH"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: conan-cache
        with:
          path: ~/.conan2
          restore-keys: ios-core-${{ runner.os }}-
          key: ios-core-${{ runner.os }}-${{ hashFiles('android/core-source.json', 'vendor/trusttunnel/*.patch', 'ios/scripts/build-core.sh', 'ios/patches/*.patch') }}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: core-cache
        with:
          path: ios/.build/VpnClientFramework.xcframework
          key: ios-framework-xcode26.3-${{ hashFiles('android/core-source.json', 'vendor/trusttunnel/*.patch', 'ios/scripts/build-core.sh', 'scripts/export-patched-boringssl.sh', 'ios/patches/*.patch') }}
      - name: Build patched stable core
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: bash ios/scripts/build-core.sh
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          path: ios/.build/VpnClientFramework.xcframework
          key: ${{ steps.core-cache.outputs.cache-primary-key }}
      - name: Generate Xcode project
        run: |
          xcodegen generate --spec ios/project.yml
          mkdir -p ios/FreeTunnel.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp ios/FreeTunnelCore/Package.resolved ios/FreeTunnel.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Compile for simulator
        run: xcodebuild -project ios/FreeTunnel.xcodeproj -scheme FreeTunnel -sdk iphonesimulator -configuration Debug -derivedDataPath ios/DerivedData CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      - name: Compile for iPhone
        run: xcodebuild -project ios/FreeTunnel.xcodeproj -scheme FreeTunnel -sdk iphoneos -configuration Release -derivedDataPath ios/DerivedData-device CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      - name: UI journeys and small iPhone / iPad layout checks
        timeout-minutes: 35
        run: bash ios/scripts/ui-tests.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-ui-tests
          path: ios/ui-results/
      - name: Render iPhone previews
        timeout-minutes: 25
        run: bash ios/scripts/preview.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ios-previews
          path: ios/previews/*.png
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.conan2
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
