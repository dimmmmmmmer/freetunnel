<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <!-- macOS menu-bar mark, connected. A template image: macOS reads only the
       alpha and paints it in whatever the menu bar needs — black on a light bar,
       white on a dark one, inverted while the menu is open — which the coloured
       logo-green.svg could not do. The four arches of the logo, combined
       even-odd, so the tunnel reads as solid bands rather than as one silhouette:
       there is no colour here to separate them. -->
  <path fill="#000" fill-rule="evenodd" d="
    M12 86 L12 46 A38 38 0 0 1 88 46 L88 86 Z
    M24 86 L24 50 A26 26 0 0 1 76 50 L76 86 Z
    M36 86 L36 55 A14 14 0 0 1 64 55 L64 86 Z
    M46 86 L46 60 A4 4 0 0 1 54 60 L54 86 Z"/>
</svg>
